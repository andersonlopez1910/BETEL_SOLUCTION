services:
  postgres:
    image: postgres:17-alpine
    container_name: betel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: betel
      POSTGRES_PASSWORD: betel_local
      POSTGRES_DB: betel
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betel -d betel"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - betel_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init/01-application-role.sql:/docker-entrypoint-initdb.d/01-application-role.sql:ro
  # Buzón de pruebas para el envío de correos (Recaudos → "Enviar por correo"). Recibe los correos sin
  # entregarlos y los muestra en http://localhost:8025. Iniciar con: docker compose --profile mail up -d
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: betel-mailpit
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  betel_postgres:
